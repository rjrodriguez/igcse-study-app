<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IGCSE Study App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
      /* Estilos para el splashscreen */
      #splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #1a237e; /* Color primario */
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 9999;
        font-family: Arial, sans-serif;
      }
      #splash h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
      }
      #splash p {
        font-size: 1rem;
      }
      /* Ocultar el splashscreen una vez que la app esté cargada */
      #splash.hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="splash">
      <h1>IGCSE Study App</h1>
      <p>Cargando...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Ocultar el splashscreen cuando la app esté lista
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hidden');
          }
        }, 1000); // Esperar 1 segundo antes de ocultar
      });
    </script>
  </body>
</html>
